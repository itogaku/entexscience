<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>理科 大問ジェネレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&display=swap">
<style>
:root{
  --bg:#E9EEEC;--panel:#F7F9F8;--paper:#FFFFFF;--ink:#1B2226;--muted:#5B696D;--line:#B7C2C4;--rule:#1B2226;
  --accent:#0E6A70;--accent-ink:#FFFFFF;--accent-soft:#D6E9E8;--red:#C4302B;--red-soft:#FBEDEC;
  --shade:#D9E0E1;--grid:#CFD8DA;--water:#D7E8EE;--chip:#FFFFFF;
  --sans:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --serif:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0F1416;--panel:#161D20;--paper:#1B2326;--ink:#E2E8E9;--muted:#98A6AA;--line:#3A474B;--rule:#C9D2D4;
  --accent:#4DB3B3;--accent-ink:#0B1415;--accent-soft:#1D3436;--red:#FF7B70;--red-soft:#3A2120;
  --shade:#34403F;--grid:#2C373A;--water:#1C3440;--chip:#1B2326;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0F1416;--panel:#161D20;--paper:#1B2326;--ink:#E2E8E9;--muted:#98A6AA;--line:#3A474B;--rule:#C9D2D4;
  --accent:#4DB3B3;--accent-ink:#0B1415;--accent-soft:#1D3436;--red:#FF7B70;--red-soft:#3A2120;
  --shade:#34403F;--grid:#2C373A;--water:#1C3440;--chip:#1B2326;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:980px;margin:0 auto}
/* ヘッダー */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px 14px;border-bottom:2px solid var(--rule);margin-bottom:16px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.brand h1{margin:0;font-family:var(--serif);font-size:clamp(24px,4vw,32px);font-weight:700;letter-spacing:.06em;text-wrap:balance}
.meta{font-size:12px;color:var(--muted)}
/* 操作パネル */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px}
.row{display:grid;grid-template-columns:88px 1fr;gap:10px;align-items:start}
.row>.lab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;padding-top:7px}
@media (max-width:560px){.row{grid-template-columns:1fr;gap:6px}.row>.lab{padding-top:0}}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.seg.sm{min-width:40px;padding:6px 0}
.seg:hover{border-color:var(--accent)}
.seg.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:5px 10px 5px 8px;cursor:pointer;font-size:13px}
.chip input{accent-color:var(--accent);margin:0;width:15px;height:15px}
.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.ugrp+.ugrp{margin-top:10px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.theme{border:1px solid var(--line);border-radius:8px;background:var(--chip);padding:6px 8px}
.theme.has{border-color:var(--accent)}
.theme.open{grid-column:1/-1}
.th-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.th-main{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer;font-weight:700}
.th-main input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex-shrink:0}
.th-name{min-width:0}
.th-n{font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.th-btn{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:999px;padding:2px 10px;cursor:pointer}
.th-btn:hover{border-color:var(--accent)}
.chips.sub{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

.ugh{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px}
.ubtn{display:flex;gap:14px;margin-top:8px}
.link{font:inherit;font-size:12px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.hint{margin:4px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px dashed var(--line);padding-top:14px}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:10px 18px;cursor:pointer;border:1px solid var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--paper);color:var(--accent)}
.btn.sec[aria-pressed="true"]{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.codef{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.codef label{font-size:12px;color:var(--muted)}
.codef input{font:inherit;font-family:ui-monospace,Menlo,Consolas,monospace;width:92px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);text-transform:uppercase}
.codef button{font:inherit;font-size:13px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
#codeMsg{font-size:12px;color:var(--red);width:100%;text-align:right}
button:focus-visible,input:focus-visible,.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* 問題用紙 */
#sheet{margin-top:18px;background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(0,0,0,.35);padding:28px clamp(16px,4vw,44px) 40px;font-family:var(--serif);font-size:15px;line-height:1.85}
.empty{font-family:var(--sans);color:var(--muted)}
.exam-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px double var(--rule);padding-bottom:8px;margin-bottom:20px}
.eh-l{display:flex;align-items:baseline;gap:14px}
.eh-t{font-size:28px;font-weight:700;letter-spacing:.3em}
.eh-sub{font-family:var(--sans);font-size:11px;letter-spacing:.14em;border:1px solid var(--rule);padding:1px 6px}
.eh-r{display:flex;gap:18px;font-family:var(--sans);font-size:12px;align-items:baseline;flex-wrap:wrap}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em}
.nm i{display:inline-block;width:120px;border-bottom:1px solid var(--rule);margin-left:6px}
.dai{padding-block:6px 20px}
.dai+.dai{border-top:1px solid var(--line);padding-top:22px}
.dai-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.dno{display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--rule);font-family:var(--sans);font-weight:700;font-size:17px}
.dtag{font-family:var(--sans);font-size:11px;color:var(--muted);letter-spacing:.06em}
.lead{margin:6px 0 10px;text-indent:1em}
.box{border:1.5px solid var(--rule);border-radius:12px;padding:14px 16px 10px;margin:10px 0 14px;position:relative}
.boxt{position:absolute;top:-11px;left:14px;background:var(--paper);padding:0 8px;font-family:var(--sans);font-weight:700;font-size:13px}
.box p{margin:0 0 6px;padding-left:1em;text-indent:-1em}
.note{font-size:13px;color:var(--muted);margin:2px 0}
.figrow{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-end;margin:8px 0}
.fg{margin:0;max-width:100%;overflow-x:auto}
.fg figcaption{font-family:var(--sans);font-size:12px;font-weight:700;margin-bottom:2px}
.fg.wide{width:100%}
.tree{font-family:var(--sans);font-size:13px;white-space:pre;line-height:1.9;overflow-x:auto}
.tw{overflow-x:auto;max-width:100%;margin:6px 0 8px}
table.dt{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.dt th,table.dt td{border:1px solid var(--rule);padding:3px 9px;text-align:center;line-height:1.5}
table.dt th{font-weight:400;background:var(--shade)}
table.combo{border-collapse:collapse;margin:4px 0 2px;font-size:14px}
table.combo th{font-weight:700;padding:1px 12px 1px 0;text-align:left}
table.combo td{padding:1px 18px 1px 0}
.blank{display:inline-block;min-width:2.4em;border:1.5px solid var(--rule);text-align:center;padding:0 6px;line-height:1.35;font-family:var(--sans);font-weight:700;font-size:13px;margin:0 2px}
.ul{text-decoration:underline;text-underline-offset:4px}
.ull{font-family:var(--sans);font-weight:700;font-size:11px}
.qs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px}
.qs>li{display:grid;grid-template-columns:2.6em 1fr;gap:2px}
.qn{font-family:var(--sans);font-weight:400}
.qtag{font-family:var(--sans);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-right:6px;vertical-align:2px}
.ch{display:grid;gap:0 18px;margin:4px 0 0}
.ch.c1{grid-template-columns:1fr}.ch.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.ch.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.ch.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:560px){.ch.c3,.ch.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{display:flex;gap:8px}
.k{font-family:var(--sans);font-weight:700}
.gch{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px}
.gch>div{display:flex;gap:4px;align-items:flex-start}
/* SVG */
.sv{display:block;height:auto;color:var(--ink)}
.sv line,.sv polyline,.sv path,.sv rect,.sv circle,.sv ellipse{stroke:var(--ink)}
.sv polyline{fill:none}
.sv .nf{fill:none}.sv .pap{fill:var(--paper)}.sv .gy{fill:var(--shade)}.sv .wt{fill:var(--water)}
.sv .fl{fill:var(--ink);stroke:none}
.sv circle.fl{fill:var(--ink)}
.sv .gr{stroke:var(--grid)}
.sv .rd{stroke:var(--red)}.sv .flr{fill:var(--red);stroke:none}
.sv text{fill:var(--ink);stroke:none;font-family:var(--sans)}
/* 解答 */
.ans{display:none;margin-top:6px;border-left:3px solid var(--red);background:var(--red-soft);padding:6px 10px;font-family:var(--sans);font-size:13.5px;line-height:1.7}
.show-ans .ans{display:block}
.al,.el{display:inline-block;font-size:11px;font-weight:700;color:var(--paper);background:var(--red);border-radius:3px;padding:0 6px;margin-right:8px;vertical-align:1px}
.el{background:var(--muted)}
.av{color:var(--red);font-weight:700}
.ae{margin-top:3px;color:var(--ink)}
.keys{display:none;margin-top:18px;border:1.5px solid var(--red);padding:10px 14px;font-family:var(--sans);font-size:13px}
.show-ans .keys{display:block}
.keys-h{font-weight:700;color:var(--red);margin-bottom:4px}
.key-row{display:grid;grid-template-columns:2em 1fr;gap:6px;padding:3px 0;border-top:1px dotted var(--line)}
.kno{font-weight:700}
footer{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.7}
.prt{display:grid;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.prt-act{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.prt-act .hint{margin:0;max-width:60ch}
.anssheet{display:none}
.as-dai{margin-top:14px}
.as-dai ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.as-dai li{display:grid;grid-template-columns:2.6em 1fr;font-family:var(--sans);font-size:13px;line-height:1.7}
.as-a{color:var(--red);font-weight:700}
.as-e{color:var(--ink)}
@media print{
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{color-scheme:light;--bg:#fff;--panel:#fff;--paper:#fff;--ink:#000;--muted:#444;--line:#999;--rule:#000;--accent:#0E6A70;--accent-soft:#e6f0f0;--red:#C4302B;--red-soft:#fff;--shade:#e4e4e4;--grid:#cfcfcf;--water:#e3eef2;--chip:#fff}
  @page{size:A4;margin:13mm 12mm 14mm}
  body{background:#fff;padding:0;font-size:10.5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{max-width:none}
  .top,.panel,footer{display:none!important}
  #sheet{border:0;box-shadow:none;padding:0;margin:0;font-size:10.5pt;line-height:1.75}
  .exam-h{margin-bottom:12px}
  .qs>li,.fg,.box,.tw,.gch,.ch,table.combo{break-inside:avoid}
  .dai-h,.lead{break-after:avoid}
  .dai{padding-block:4px 12px}
  body.pbreak #sheet .dai+.dai{break-before:page;border-top:0;padding-top:0}
  .ans,.keys{display:none!important}
  body.pm-inline .ans{display:block!important;border-left:2px solid var(--red);background:#fff}
  body.pm-end .anssheet{display:block;break-before:page}
  .as-dai li{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}</style>

<body>


<div class="wrap">
  <header class="top">
    <div class="brand"><small>高校入試・理科</small><h1>理科 大問ジェネレーター</h1></div>
    <div class="meta"><span id="nUnits">0</span>単元／押すたびに数値と設問が変わる</div>
  </header>

  <div class="panel">
    <div class="row"><div class="lab">分野</div><div class="segs" id="fields" role="group" aria-label="分野"></div></div>
    <div class="row"><div class="lab">単元</div><div id="units"></div></div>
    <div class="row"><div class="lab">大問の数</div><div class="segs" id="count" role="group" aria-label="大問の数"></div></div>
    <div class="row"><div class="lab">印刷</div><div class="prt"><div class="segs" id="pmode" role="group" aria-label="解答の印刷"></div><label class="chk"><input type="checkbox" id="pbreak"> 大問ごとに改ページする</label><div class="prt-act"><button type="button" class="btn pri" id="printBtn" hidden>印刷する</button><p class="hint" id="printHint"></p></div></div></div>
    <div class="actions">
      <button type="button" class="btn pri" id="genBtn">新しい問題をつくる</button>
      <button type="button" class="btn sec" id="ansBtn" aria-pressed="false">解答と解説を表示</button>
      <form class="codef" id="codeForm"><label for="codeIn">問題番号で呼び出す</label><input id="codeIn" autocomplete="off" maxlength="6" placeholder="例 0A1B2"><button type="submit">表示</button><span id="codeMsg" aria-live="polite"></span></form>
    </div>
  </div>

  <main id="sheet" aria-live="polite"></main>

  <footer>問題番号を控えておくと、同じ分野・単元の設定で同じ問題をもう一度表示できます。飽和水蒸気量、溶解度、密度、融点・沸点などの表の値は、教科書で使われる代表的な値です。</footer>
</div>
<script>
'use strict';
/* ===== 共通ライブラリ ===== */
const KANA=['ア','イ','ウ','エ','オ','カ','キ','ク','ケ','コ'];
const UNITS=[];
function unit(o){UNITS.push(o);}

function mkRng(seed){
  let a=seed>>>0;
  const next=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const r={
    next,
    int:(lo,hi)=>lo+Math.floor(next()*(hi-lo+1)),
    pick:a=>a[Math.floor(next()*a.length)],
    chance:p=>next()<p,
    shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(next()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
    sample:(a,n)=>r.shuffle(a).slice(0,n),
    step:(lo,hi,st)=>{const n=Math.round((hi-lo)/st);return +(lo+st*r.int(0,n)).toFixed(6);},
  };
  return r;
}
/* 数値の表示 */
const fx=(x,d)=>(Math.round(x*Math.pow(10,d)+1e-9)/Math.pow(10,d)).toFixed(d);
const nm=x=>String(+(+x).toFixed(6));
const rd=(x,d)=>Math.round(x*Math.pow(10,d)+1e-9)/Math.pow(10,d);
const gcd=(a,b)=>b?gcd(b,a%b):a;
const ratio=(a,b)=>{const g=gcd(a,b);return `${a/g}：${b/g}`;};

/* 文章パーツ */
const bx=t=>`<span class="blank">${t}</span>`;
const ul=(t,l)=>`<span class="ul">${t}</span>${l?`<sub class="ull">${l}</sub>`:''}`;
const b=t=>`<b>${t}</b>`;
const Q=(q,a,e)=>({q,a,e:e||''});

/* 選択肢：正解+誤答をシャッフル */
function mc(r,correct,wrongs,opt={}){
  let list=opt.keep?[correct,...wrongs]:r.shuffle([correct,...wrongs]);
  if(opt.order) list=opt.order(list);
  const i=list.indexOf(correct);
  return {h:choices(list,opt.cols),a:KANA[i],t:correct};
}
/* 並び固定の選択肢 */
function mcFixed(list,ci,cols){return {h:choices(list,cols),a:KANA[ci],t:list[ci]};}
function choices(list,cols){
  const long=list.some(s=>String(s).replace(/<[^>]+>/g,'').length>16);
  const c=cols||(long?1:(list.length<=4?(list.every(s=>String(s).replace(/<[^>]+>/g,'').length<=7)?4:2):3));
  return `<div class="ch c${c}">${list.map((s,i)=>`<div class="opt"><span class="k">${KANA[i]}</span><span>${s}</span></div>`).join('')}</div>`;
}
/* 2項目の組み合わせ選択肢（ア〜エ） */
function combo(labels,A,B,ca,cb){
  const list=[];
  for(let i=0;i<A.length;i++)for(let j=0;j<B.length;j++)list.push([A[i],B[j]]);
  const rows=list.map((p,k)=>`<tr><th>${KANA[k]}</th><td>${labels[0]}：${p[0]}</td><td>${labels[1]}：${p[1]}</td></tr>`).join('');
  const idx=ca*B.length+cb;
  return {h:`<table class="combo">${rows}</table>`,a:KANA[idx],t:`${labels[0]}：${A[ca]}、${labels[1]}：${B[cb]}`};
}
/* 表 */
function tbl(rows,opt={}){
  const hc=opt.hc!==false; // 1列目を見出しに
  const hr=opt.hr!==false; // 1行目を見出しに
  return `<div class="tw"><table class="dt${opt.cls?' '+opt.cls:''}">${rows.map((row,ri)=>`<tr>${row.map((c,ci)=>{const th=(hr&&ri===0)||(hc&&ci===0);return th?`<th>${c}</th>`:`<td>${c}</td>`;}).join('')}</tr>`).join('')}</table></div>`;
}
/* 図の枠 */
const fig=(cap,svg,cls)=>`<figure class="fg${cls?' '+cls:''}">${cap?`<figcaption>${cap}</figcaption>`:''}${svg}</figure>`;
const figs=(...f)=>`<div class="figrow">${f.join('')}</div>`;
const box=(html,title)=>`<div class="box">${title?`<div class="boxt">${title}</div>`:''}${html}</div>`;

/* SVG */
function svg(w,h,body){return `<svg class="sv" viewBox="0 0 ${w} ${h}" width="${w}" style="max-width:100%" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;}
const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.s||12}" text-anchor="${o.a||'middle'}"${o.w?` font-weight="bold"`:''}${o.c?` class="${o.c}"`:''}${o.dy?` dy="${o.dy}"`:''}>${t}</text>`;
const L=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${o.w||1.3}"${o.d?` stroke-dasharray="${o.d}"`:''}${o.c?` class="${o.c}"`:''}${o.m?` marker-end="url(#ar)"`:''}/>`;
const R=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" stroke-width="${o.w||1.3}" class="${o.c||'nf'}"${o.rx?` rx="${o.rx}"`:''}/>`;
const C=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" stroke-width="${o.w||1.3}" class="${o.c||'nf'}"/>`;
const P=(d,o={})=>`<path d="${d}" stroke-width="${o.w||1.3}" class="${o.c||'nf'}"${o.dd?` stroke-dasharray="${o.dd}"`:''}${o.m?` marker-end="url(#ar)"`:''}/>`;
const ARW=`<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fl"/></marker></defs>`;
/* 矢印（マーカーを使わず描画：同一ページで複数SVGでも安全） */
function arrow(x1,y1,x2,y2,o={}){
  const a=Math.atan2(y2-y1,x2-x1),s=o.hs||8;
  const p1=[x2-s*Math.cos(a-0.4),y2-s*Math.sin(a-0.4)],p2=[x2-s*Math.cos(a+0.4),y2-s*Math.sin(a+0.4)];
  return L(x1,y1,x2,y2,o)+`<path d="M${x2},${y2} L${p1[0].toFixed(1)},${p1[1].toFixed(1)} L${p2[0].toFixed(1)},${p2[1].toFixed(1)} z" class="${o.c==='rd'?'flr':'fl'}"/>`;
}

/* グラフ */
function graph(o){
  const w=o.w||300,h=o.h||220,pl=o.pl||46,pb=34,pt=24,pr=o.pr||16;
  const [x0,x1,xs]=o.x,[y0,y1,ys]=o.y;
  const X=v=>pl+(v-x0)/(x1-x0)*(w-pl-pr),Y=v=>h-pb-(v-y0)/(y1-y0)*(h-pb-pt);
  let s='';
  const sub=o.sub||1;
  if(o.grid!==false){
    for(let v=x0;v<=x1+1e-9;v+=xs/sub)s+=L(X(v),Y(y0),X(v),Y(y1),{w:0.5,c:'gr'});
    for(let v=y0;v<=y1+1e-9;v+=ys/sub)s+=L(X(x0),Y(v),X(x1),Y(v),{w:0.5,c:'gr'});
  }
  s+=L(X(x0),Y(y0),X(x1),Y(y0),{w:1.4})+L(X(x0),Y(y0),X(x0),Y(y1),{w:1.4});
  const xd=o.xd!=null?o.xd:(String(xs).split('.')[1]||'').length, yd=o.yd!=null?o.yd:(String(ys).split('.')[1]||'').length;
  for(let v=x0;v<=x1+1e-9;v+=xs)s+=T(X(v),Y(y0)+14,fx(v,xd),{s:10});
  for(let v=y0;v<=y1+1e-9;v+=ys)s+=T(X(x0)-5,Y(v)+4,fx(v,yd),{s:10,a:'end'});
  if(o.xl)s+=T((X(x0)+X(x1))/2,h-4,o.xl,{s:11});
  if(o.yl)s+=T(X(x0)-4,12,o.yl,{s:11,a:'start'});
  (o.series||[]).forEach(se=>{
    if(se.line!==false&&se.pts.length>1)s+=`<polyline points="${se.pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke-width="${se.w||1.6}"${se.dash?` stroke-dasharray="${se.dash}"`:''}/>`;
    if(se.dots)se.pts.forEach(p=>s+=se.dots==='x'?`<path d="M${X(p[0])-3.5},${Y(p[1])-3.5} l7,7 m0,-7 l-7,7" stroke-width="1.5"/>`:C(X(p[0]),Y(p[1]),2.8,{c:'fl'}));
    if(se.label){const p=se.pts[se.pts.length-1];s+=T(X(p[0])+(se.ldx||4),Y(p[1])+(se.ldy||4),se.label,{s:12,a:'start',w:1});}
  });
  if(o.extra)s+=o.extra(X,Y);
  return svg(w,h,s);
}
/* 並べて選ぶ用の小グラフ群 */
function graphChoices(list){return `<div class="gch">${list.map((g,i)=>`<div><div class="k">${KANA[i]}</div>${g}</div>`).join('')}</div>`;}

/* 問題を選ぶ（順序は保持） */
function take(r,pool,n){
  const must=pool.filter(p=>p&&p.must),rest=pool.filter(p=>p&&!p.must);
  const need=Math.max(0,n-must.length);
  const chosen=new Set([...must,...r.sample(rest,need)]);
  return pool.filter(p=>chosen.has(p));
}

function gchoice(r,list,ci){const idx=r.shuffle(list.map((_,i)=>i));return {h:graphChoices(idx.map(i=>list[i])),a:KANA[idx.indexOf(ci)]};}

/* ---------- 力と運動（記録タイマー） ---------- */
function tapeChart(Ls,unitLabel){
  const w=300,h=200,pl=46,pb=26,max=Math.max(...Ls)*1.12,bw=28;
  const Y=v=>h-pb-v/max*(h-pb-12);
  let s=L(pl,h-pb,pl+Ls.length*bw+10,h-pb,{w:1.4})+L(pl,h-pb,pl,8,{w:1.4});
  Ls.forEach((v,i)=>{
    const x=pl+6+i*bw;
    s+=R(x,Y(v),bw-4,h-pb-Y(v),{c:'pap'});
    const n=Math.max(2,Math.round(v/Ls[Ls.length-1]*6));
    for(let k=1;k<=n;k++)s+=C(x+(bw-4)/2,Y(v)+(h-pb-Y(v))*k/(n+1),1.4,{c:'fl'});
    s+=L(pl-4,Y(v),x,Y(v),{w:0.6,d:'2 2'});
    s+=T(pl-6,Y(v)+4,fx(v,1),{s:10,a:'end'});
    s+=T(x+(bw-4)/2,h-pb+14,`${i+1}`,{s:10});
  });
  s+=T(pl-4,h-4,'テープ',{s:10,a:'end'});
  s+=T(pl+4,10,unitLabel,{s:10,a:'start'});
  return svg(w,h,s);
}
function slopeFig(label){

  s+=R(28,52,30,16,{c:'pap'})+T(43,64,'ﾀｲﾏｰ',{s:9});
  s+=P('M58,62 Q90,68 125,92',{dd:'3 2'});
  s+=T(190,50,label||'台車',{s:11})+L(180,56,160,84,{w:0.8});
  s+=T(250,140,'斜面',{s:11});
  return svg(310,160,s);
}

  s+=T(x0-44,100,`${th}°`,{s:11});

  return svg(280,130,s);
}

/* ---------- 音 ---------- */
function wave(n,amp,w=200,h=110,div=10){
  let s='';const gx=w/div,rows=6,gy=h/rows;
  for(let i=0;i<=div;i++)s+=L(i*gx+4,4,i*gx+4,h+4,{w:0.5,c:'gr'});
  for(let j=0;j<=rows;j++)s+=L(4,j*gy+4,w+4,j*gy+4,{w:0.5,c:'gr'});
  let d='';for(let i=0;i<=400;i++){const x=i/400*w,y=h/2-amp*gy*Math.sin(2*Math.PI*n*i/400);d+=(i?'L':'M')+(x+4).toFixed(1)+','+(y+4).toFixed(1);}
  s+=P(d,{w:1.6});
  return svg(w+8,h+8,s);
}

  s+=R(52,62,40,10,{c:'gy'});
  s+=L(170,74,230,100)+R(215,95,40,60,{c:'wt'})+T(260,150,'石灰水',{s:10,a:'start'});
  s+=L(70,110,110,110)+P('M80,110 Q90,90 100,110',{c:'nf'})+T(90,126,'ガスバーナー',{s:10});
  s+=T(80,38,'試験管A',{s:10})+T(40,96,'粉末',{s:10});
  return svg(310,134,s);
}

/* ---------- 動物の分類 ---------- */
const ANI={

};
const CLS={fish:'魚類',amph:'両生類',rept:'は虫類',bird:'鳥類',mamm:'ホニュウ類'};
const FEAT=[
  {t:'背骨をもつ',v:{fish:'○',amph:'○',rept:'○',bird:'○',mamm:'○'}},
  {t:'肺で呼吸する',v:{fish:'×',amph:'△',rept:'○',bird:'○',mamm:'○'}},
  {t:'胎生である',v:{fish:'×',amph:'×',rept:'×',bird:'×',mamm:'○'}},
  {t:'殻のある卵を陸上に産む',v:{fish:'×',amph:'×',rept:'○',bird:'○',mamm:'×'}},
  {t:'体の表面がうろこでおおわれている',v:{fish:'○',amph:'×',rept:'○',bird:'×',mamm:'×'}},
  {t:'体温がほぼ一定に保たれる（恒温動物）',v:{fish:'×',amph:'×',rept:'×',bird:'○',mamm:'○'}},
  {t:'卵を水中に産む',v:{fish:'○',amph:'○',rept:'×',bird:'×',mamm:'×'}},

];
unit({id:'b_animal',f:'生物',n:'動物の分類',gen(r){
  const pickOne=c=>r.pick(Object.keys(ANI).filter(k=>ANI[k]===c));
  const cls=['fish','amph','rept','bird','mamm'];
  const anis=cls.map(pickOne);
  // 列を区別できる特徴を選ぶ（背骨は除く）
  let feats;
  for(let t=0;t<50;t++){feats=r.sample(FEAT.slice(1),4);const sig=feats.map(f=>cls.map(c=>f.v[c]).join(''));if(new Set(sig).size===4)break;}
  const R=['Ⅰ','Ⅱ','Ⅲ','Ⅳ'];
  const lead=`${anis.join('、')}の5種類の動物を、いくつかの特徴をもとになかま分けした。表の特徴Ⅰ〜Ⅳは、あとのア〜カのいずれかであり、その特徴をもつ場合は○、もたない場合は×、子はもたないが親（おとな）はもつ場合は△で示している。あとの問いに答えなさい。`;
  const body=tbl([['',...anis],...feats.map((f,i)=>[`特徴${R[i]}`,...cls.map(c=>f.v[c])])]);
  const others=FEAT.slice(1).filter(f=>!feats.includes(f));
  const opts=r.shuffle(feats.concat(others.slice(0,2)));
  const optH=choices(opts.map(f=>f.t),1);
  const pool=[];
  const qi=r.sample([0,1,2,3],2);
  qi.forEach(i=>pool.push(Q(`特徴${R[i]}にあてはまるものを、次のア〜カから1つ選びなさい。${optH}`,KANA[opts.indexOf(feats[i])],`${feats[i].t}：${cls.map((c,j)=>`${anis[j]}${feats[i].v[c]}`).join('、')}`)));
  const am=anis[1];
  pool.push(Q(`${am}は、子と親（おとな）で呼吸のしかたが異なる。それぞれ何で呼吸するか書きなさい。`,'子：えら（と皮膚）、親：肺と皮膚','両生類の子は水中でえら呼吸をし、親は肺と皮膚で呼吸する。'));
  const tgt=r.pick([2,3,4]);
  const c=mc(r,CLS[cls[tgt]],cls.filter((_,i)=>i!==tgt).map(x=>CLS[x]).slice(0,3));
  pool.push(Q(`${anis[tgt]}は、なかま分けすると何類か。${c.h}`,c.a,`${anis[tgt]}は${CLS[cls[tgt]]}である。`));
  pool.push(Q(`5種類の動物はすべて背骨をもつ。背骨をもつ動物を何というか。また、背骨をもたない動物のうち、カニやバッタのように体とあしに節があり、外骨格をもつなかまを何というか。`,'セキツイ動物、節足動物','背骨をもたない動物は無セキツイ動物。外骨格をもち体とあしに節があるのが節足動物。'));
  const cb=combo(['目のつき方','発達した歯'],['前向き','横向き'],['犬歯','臼歯'],1,1);
  pool.push(Q(`シマウマのような草食動物の、目のつき方と発達した歯の組み合わせとして正しいものを選びなさい。${cb.h}`,cb.a,'草食動物は目が横向きで広い範囲を見わたせ、草をすりつぶす臼歯が発達している。肉食動物は目が前向きで立体的に見える範囲が広く、犬歯が発達している。'));
  pool.push(Q(`ヒトの腕、クジラのひれ、コウモリの翼のように、形やはたらきは異なるが、基本的なつくりが同じで、もとは同じものから変化したと考えられる器官を何というか。`,'相同器官','相同器官は、生物が長い時間をかけて進化してきたことの証拠と考えられている。'));
  const c2=mc(r,'外とう膜',['外骨格','うろこ','羽毛']);
  pool.push(Q(`イカやアサリのように、内臓が筋肉でできた膜に包まれている軟体動物がもつこの膜を何というか。${c2.h}`,c2.a,'軟体動物は内臓をおおう外とう膜をもつ。'));
  return {lead,body,qs:take(r,pool,5)};
},
mini:[r=>{const a=r.pick(Object.keys(ANI));const c=mc(r,CLS[ANI[a]],r.sample(Object.values(CLS).filter(x=>x!==CLS[ANI[a]]),3));return Q(`${a}はセキツイ動物のどのなかまに分類されるか。${c.h}`,c.a,`${a}は${CLS[ANI[a]]}。`);}
]});

  const base=per*n;

  const avg=rd(tries.reduce((a,b)=>a+b,0)/5,2);
  const lead=`刺激に対する反応について調べるため、次の実験を行った。あとの問いに答えなさい。`;
  const body=box(`<p>① ${n}人が手をつないで輪になり、最初の人は右手にストップウォッチを持った。</p><p>② 最初の人はストップウォッチをスタートさせると同時に、左手でとなりの人の右手をにぎった。右手をにぎられた人は、すぐに左手でとなりの人の右手をにぎり、これを順に行った。</p><p>③ 最後の人は右手をにぎられたら、左手で最初の人の右手をにぎり、最初の人はにぎられたらすぐにストップウォッチを止めた。</p><p>④ この実験を5回行った（表）。</p>${tbl([['回',1,2,3,4,5],['時間〔秒〕',...tries.map(t=>fx(t,2))]])}`,'実験');
  const pool=[];
  pool.push(Q(`5回の平均の時間は何秒か。`,`${fx(avg,2)}秒`,`${tries.map(t=>fx(t,2)).join('＋')}＝${fx(tries.reduce((a,b)=>a+b,0),2)}。÷5＝${fx(avg,2)}秒`));
  pool.push(Q(`5回の平均の時間から、1人あたりの反応にかかった時間は何秒か。小数第2位まで求めなさい。`,`${fx(avg/n,2)}秒`,`刺激を受けて反応したのは最初の人をふくめ${n}人なので、${fx(avg,2)}÷${n}＝${fx(avg/n,2)}秒`));
  const c=mc(r,'皮膚→感覚神経→せきずい→脳→せきずい→運動神経→筋肉',['皮膚→運動神経→せきずい→脳→せきずい→感覚神経→筋肉','皮膚→感覚神経→せきずい→運動神経→筋肉','皮膚→感覚神経→脳→感覚神経→筋肉']);

function columns(cols,maxD){

      s+=L(x,py,x+w,py,{w:.8});

function rockFig(type,seed){

  s+=C(60,60,54,{c:'nf',w:1.5});
  return svg(120,120,s);
}

unit({id:'c_fes',f:'化学',n:'鉄と硫黄の反応',gen(r){

/* ---------- 太陽の黒点 ---------- */
function sunFig(days,angs){
  let s='';days.forEach((d,i)=>{const cx=60+i*110,cy=60,R0=46;s+=C(cx,cy,R0,{c:'pap'});
    const x=cx+R0*Math.sin(angs[i]*Math.PI/180),w=Math.max(1.5,5*Math.cos(angs[i]*Math.PI/180));
    s+=`<ellipse cx="${x.toFixed(1)}" cy="${cy+8}" rx="${w.toFixed(1)}" ry="5" class="fl"/>`;
    s+=T(cx,cy+R0+16,`${d}日目`,{s:11});});
  s+=T(10,12,'東',{s:10,a:'start'})+T(10+days.length*110-20,12,'西',{s:10,a:'end'});
  return svg(days.length*110+10,130,s);
}

function lensRay(f,a,showAns){
  const sc=Math.min(8,380/(a+(a*f/(a-f))+10));const cx=40+a*sc,cy=90,h=28;
  const b=a*f/(a-f),hi=-h*b/a;const W=cx+b*sc+40;
  let s=L(10,cy,W-10,cy,{w:.8});
  s+=`<ellipse cx="${cx}" cy="${cy}" rx="5" ry="60" class="pap" stroke-width="1.2"/>`;
  s+=C(cx-f*sc,cy,2.5,{c:'fl'})+T(cx-f*sc,cy+16,'F',{s:11})+C(cx+f*sc,cy,2.5,{c:'fl'})+T(cx+f*sc,cy+16,'F',{s:11});
  const ox=cx-a*sc;s+=arrow(ox,cy,ox,cy-h,{w:2})+T(ox-8,cy-h,'P',{s:11,a:'end'});
  if(showAns){
    const ix=cx+b*sc,iy=cy-hi;
    s+=L(ox,cy-h,cx,cy-h,{w:1.3,c:'rd'})+L(cx,cy-h,ix,iy,{w:1.3,c:'rd'});
    s+=L(ox,cy-h,ix,iy,{w:1.3,c:'rd'});
    s+=arrow(ix,cy,ix,iy,{w:2,c:'rd'})+T(ix+6,iy+4,'像',{s:11,a:'start'});
  }
  return svg(Math.max(W,200),cy+70,s);
}

unit({id:'c_conc',f:'化学',n:'水溶液の濃度（混合・うすめる）',gen(r){

  const c=mc(r,'溶質',['溶媒','溶液','結晶']);
  pool.push(Q(`食塩水の食塩のように、とけている物質を何というか。${c.h}`,c.a,'とかしている液体（水）を溶媒、とけている物質を溶質、全体を溶液という。'));
  const c2=mc(r,'どの部分も同じ濃さになっている',['底の方が濃くなっている','上の方が濃くなっている','時間がたつと食塩が底にたまる']);

function addQ(id,fns){
  const u=UNITS.find(x=>x.id===id);if(!u)return;

  u.gen=function(r){const g=g0(r);const ex=fns.map(f=>f(r)).filter(Boolean);

}

/* ---------- ばね2本のつなぎ方 ---------- */
unit({id:'p_spring2',f:'物理',n:'ばね2本のつなぎ方（直列・並列）',gen(r){
  const [a,b]=r.sample([1,2,3,4,5,6],2).sort((x,y)=>x-y);
  const ms=[0,50,100,150,200];const W=r.pick([2,3,4,6]);
  const lead=`2種類のばねA、Bを使って、ばねの伸びを調べた。あとの問いに答えなさい。ただし、質量100 gの物体にはたらく重力の大きさを1 Nとし、ばねの質量や、ばねをつなぐ棒・糸の質量は考えないものとする。`;
  const body=box(`<p>実験1　ばねA、Bにそれぞれおもりをつるし、おもりの質量とばねの伸びを調べた（表）。</p>${tbl([['おもりの質量〔g〕',...ms],['ばねAの伸び〔cm〕',...ms.map(m=>fx(m/100*a,1))],['ばねBの伸び〔cm〕',...ms.map(m=>fx(m/100*b,1))]])}<p>実験2　ばねAとばねBを縦につなぎ（直列）、下に重さ${W} Nのおもりをつるした。</p><p>実験3　同じばねAを2本並べ（並列）、下端を軽い棒でつないで、棒の中央に重さ${W} Nのおもりをつるすと、棒は水平になった。</p>`,'実験');
  const pool=[];
  pool.push(Q(`ばねAとばねBのうち、同じ力を加えたときに伸びにくいのはどちらか。`,'ばねA',`1 Nあたりの伸びは、Aが${a} cm、Bが${b} cm。伸びが小さいAの方が伸びにくい。`));
  pool.push(Q(`ばねBを${nm(b*W)} cm伸ばすには、何Nの力が必要か。`,`${W} N`,`1 Nで${b} cm伸びるので、${nm(b*W)}÷${b}＝${W} N`));
  pool.push(Q(`実験2で、ばねA、Bの伸びの合計は何cmか。`,`${a*W+b*W} cm`,`直列につなぐと、どちらのばねにもおもりの重さ${W} Nの力がはたらく。Aは${a*W} cm、Bは${b*W} cm伸びる。`));
  pool.push(Q(`実験3で、ばねA1本の伸びは何cmか。`,`${nm(a*W/2)} cm`,`並列につなぐと、2本のばねで重さを分けて支えるので、1本には${nm(W/2)} Nの力がはたらく。${nm(W/2)}×${a}＝${nm(a*W/2)} cm`));
  const c=mc(r,'ばねにはたらく力は等しく、伸びの合計は1本のときより大きい',['ばねにはたらく力は半分になる','伸びの合計は1本のときと同じ','ばねにはたらく力は2倍になる']);
  pool.push(Q(`ばねを直列につないだときの説明として正しいものを選びなさい。${c.h}`,c.a,'直列ではそれぞれのばねに同じ大きさの力がはたらく。'));
  const g=graph({w:260,h:200,x:[0,2,0.5],y:[0,Math.ceil(b*2/2)*2,2],xl:'力の大きさ〔N〕',yl:'伸び〔cm〕',yd:0,series:[{pts:[[0,0],[2,a*2]],label:'P'},{pts:[[0,0],[2,b*2]],label:'Q'}]});
  const cg=mcFixed(['P','Q'],1,2);
  pool.push(Q(`図のP、Qは、ばねA、Bのどちらかの力の大きさと伸びの関係を表したグラフである。ばねBを表しているのはどちらか。${fig('',g)}${cg.h}`,cg.a,'同じ力で伸びが大きい（グラフの傾きが大きい）方がばねB。'));
  return {lead,body,qs:take(r,pool,6)};
}});

/* ---------- 3つの抵抗の回路 ---------- */
function mixCircuit(){
  let s='';const X0=20,X1=300,Yt=24,Yb=120;
  s+=L(X0,Yt,155,Yt)+battery(160,Yt)+L(165,Yt,X1,Yt)+L(X0,Yt,X0,Yb)+L(X1,Yt,X1,Yb);
  s+=L(X0,Yb,50,Yb)+resistor(50,Yb,50,'R₁')+L(100,Yb,150,Yb);
  s+=L(150,Yb-26,150,Yb+26)+L(250,Yb-26,250,Yb+26);
  s+=L(150,Yb-26,175,Yb-26)+resistor(175,Yb-26,50,'R₂')+L(225,Yb-26,250,Yb-26);
  s+=L(150,Yb+26,175,Yb+26)+resistor(175,Yb+26,50,'R₃')+L(225,Yb+26,250,Yb+26);
  s+=L(250,Yb,X1,Yb)+meter(X1,72,'A');
  return svg(320,170,s);
}
unit({id:'p_ohm2',f:'物理',n:'3つの抵抗を組み合わせた回路',gen(r){
  const pr=r.pick([[4,4],[6,6],[10,10],[20,30],[30,20],[12,4],[4,12],[30,70]]);const [R2,R3]=pr;const Rp=R2*R3/(R2+R3);
  const R1=r.pick([2,3,4,6,8,10]);const I=r.pick([0.5,1,1.5,2]);const V=rd(I*(R1+Rp),3);
  const V1=rd(I*R1,3),Vp=rd(I*Rp,3),I2=rd(Vp/R2,3),I3=rd(Vp/R3,3);

/* ---------- 季節と太陽の通り道 ---------- */
function hemi3(labels){
  let s=`<ellipse cx="150" cy="130" rx="120" ry="34" class="nf" stroke-width="1.2"/>`+P('M30,130 A120,112 0 0,1 270,130',{c:'nf'});
  const pos=[{s:[48,112],e:[252,112],c:-10},{s:[30,130],e:[270,130],c:30},{s:[48,148],e:[252,148],c:74}];// 夏・春分・冬
  pos.forEach((p,i)=>{s+=P(`M${p.s[0]},${p.s[1]} Q150,${p.c} ${p.e[0]},${p.e[1]}`,{w:1.5});s+=T(150,(p.s[1]+2*p.c+p.e[1])/4-6,labels[i],{s:12,w:1});});
  s+=T(18,134,'東',{s:11})+T(284,134,'西',{s:11})+T(150,180,'南',{s:11})+T(214,104,'北',{s:10});
  return svg(300,186,s);
}

/* ---------- 電磁誘導の向き ---------- */
function coilDrop(){
  let s='';for(let i=0;i<6;i++)s+=`<ellipse cx="90" cy="${70+i*10}" rx="30" ry="7" class="nf" stroke-width="1.2"/>`;
  s+=L(60,120,60,150)+L(120,120,120,150)+L(60,150,80,150)+meter(92,150,'G')+L(104,150,120,150);
  s+=R(80,4,20,20,{c:'gy'})+R(80,24,20,20,{c:'pap'})+T(90,18,'S',{s:11,w:1})+T(90,38,'N',{s:11,w:1});
  s+=arrow(130,20,130,56)+T(138,40,'落とす',{s:10,a:'start'});
  return svg(190,172,s);
}

unit({id:'c_gasvol',f:'化学',n:'気体の反応と体積（水素と酸素）',gen(r){
  const h=r.pick([4,6,8,10]);const os=[1,2,3,4,5,6,7,8].filter(o=>o<=h);

  const body=tbl([['酸素〔cm³〕',...os],['残った気体〔cm³〕',...os.map(o=>nm(rem(o)))]]);
  const pool=[];
  pool.push(Q(`水素${h} cm³と過不足なく反応する酸素は何cm³か。`,`${nm(h/2)} cm³`,`残った気体が0になる点。水素：酸素＝2：1の体積比で反応する。`));
  const o1=os.find(o=>o<h/2)||1,o2=os[os.length-1];

  const gc=gchoice(r,gs,0);
  pool.push(Q(`加えた酸素の体積と残った気体の体積の関係を表すグラフの形として最も適当なものを選びなさい。（横軸の目盛り1は${nm(h/2)} cm³）${gc.h}`,gc.a,'過不足なく反応する点までは水素が減り、それ以降は余った酸素が増える。'));
  const hh=r.pick([12,20,30]);
  pool.push(Q(`水素${hh} cm³と酸素${hh} cm³を反応させたとき、残る気体は何か。また何cm³か。`,`酸素、${hh/2} cm³`,`水素${hh} cm³と反応する酸素は${hh/2} cm³。`));
  pool.push(Q(`水素と酸素が反応して水ができる化学変化を、分子のモデルを使って考える。水素分子6個と酸素分子5個を反応させると、水分子は何個でき、何分子が何個残るか。`,'水分子6個、酸素分子2個が残る','2H₂ ＋ O₂ → 2H₂O より、水素分子6個と酸素分子3個が反応する。'));
  return {lead,body,qs:take(r,pool,5)};

  pool.push(Q(`水酸化物イオンを何個加えたとき、水溶液が中性になるか。`,`${nH}個`,'水素イオンがちょうどなくなるとき。'));

  r.sample(ions,2).forEach(io=>{const gc=gchoice(r,gs,io[1]);pool.push(Q(`水酸化ナトリウム水溶液を、中性になるまでに加えた量の2倍まで加えていくとき、${io[0]}の数の変化を表すグラフを選びなさい。（横軸の目盛り1は中性になるまでに加えた量）${gc.h}`,gc.a,io[1]===0?'水素イオンは水酸化物イオンと結びついて減り、中性で0になる。':io[1]===1?'塩化物イオンは反応しないので変わらない。':io[1]===2?'ナトリウムイオンは反応しないので、加えた分だけ増え続ける。':'中性になるまでは水になって0。その後は増える。'));});
  const c=mc(r,'中性になるまでは変わらず、その後は増える',['はじめは減り、中性で0になる','増え続ける','減り続ける']);
  pool.push(Q(`このとき、水溶液中のイオンの総数の変化として正しいものを選びなさい。${c.h}`,c.a,'中性になるまでは、水素イオンが1個減るたびにナトリウムイオンが1個増えるので総数は変わらない。中性のあとは、ナトリウムイオンと水酸化物イオンが増える。'));
  return {lead,body,qs:take(r,pool,5)};

/* ---------- 電熱線の直列・並列と水温上昇 ---------- */
unit({id:'p_heat2',f:'物理',n:'電熱線の直列・並列と発熱量',gen(r){
  const [Ra,Rb]=r.pick([[2,4],[4,8],[3,9],[6,6],[2,8],[6,12],[4,12]].filter(p=>{const I=6/(p[0]+p[1]);return Math.abs(I*1000-Math.round(I*1000))<1e-9;}));
  const V=6,c=r.pick([0.1,0.12,0.15]),t=r.pick([5,10]);
  const Pa=V*V/Ra,Pb=V*V/Rb,I=V/(Ra+Rb),Psa=I*I*Ra,Psb=I*I*Rb;
  const lead=`抵抗が${Ra} Ωの電熱線aと${Rb} Ωの電熱線bを使い、水の温度上昇を調べた。電源の電圧は${V} Vとし、電熱線から発生した熱はすべて水の温度上昇に使われるものとする。同じ量の水では、水の上昇温度は電熱線で消費した電力と時間に比例し、1 Wで1分間に${nm(c)}℃上昇するものとする。あとの問いに答えなさい。`;
  const body=box(`<p>実験1　電熱線aとbを並列につなぎ、それぞれ別の容器の水に入れて${t}分間電流を流した。</p><p>実験2　電熱線aとbを直列につなぎ、それぞれ別の容器の水に入れて${t}分間電流を流した。</p>`,'実験');
  const pool=[];
  pool.push(Q(`実験1で、電熱線aが消費する電力は何Wか。`,`${nm(Pa)} W`,`並列では電熱線aに${V} Vが加わる。電流は${V}÷${Ra}＝${nm(rd(V/Ra,3))} A。${V}×${nm(rd(V/Ra,3))}＝${nm(Pa)} W`));
  pool.push(Q(`実験1で、電熱線bを入れた水の上昇温度は何℃か。`,`${nm(rd(Pb*t*c,2))}℃`,`電力は${nm(Pb)} W。${nm(Pb)}×${t}×${nm(c)}＝${nm(rd(Pb*t*c,2))}℃`));
  pool.push(Q(`実験2で、回路に流れる電流は何Aか。`,`${nm(rd(I,3))} A`,`${V}÷(${Ra}＋${Rb})＝${nm(rd(I,3))} A`));
  pool.push(Q(`実験2で、電熱線a、bが消費する電力はそれぞれ何Wか。`,`a：${nm(rd(Psa,4))} W、b：${nm(rd(Psb,4))} W`,`直列では電流が同じ。電力＝電流²×抵抗（電圧×電流）で求める。`));
  if(Ra!==Rb){
    const cb=combo(['並列で水温がより上がる','直列で水温がより上がる'],['電熱線a','電熱線b'],['電熱線a','電熱線b'],Ra<Rb?0:1,Ra<Rb?1:0);
    pool.push(Q(`実験1、2のそれぞれで、水温がより大きく上がったのはどちらの電熱線か。組み合わせとして正しいものを選びなさい。${cb.h}`,cb.a,'並列では電圧が同じなので、抵抗が小さい方が電流が大きく、電力も大きい。直列では電流が同じなので、抵抗が大きい方が電圧が大きく、電力も大きい。'));
  }
  pool.push(Q(`実験1と実験2で、回路全体で消費する電力が大きいのはどちらか。`,'実験1（並列）','並列の方が回路全体の抵抗が小さく、流れる電流が大きいので、全体の電力が大きい。'));
  return {lead,body,qs:take(r,pool,5)};
}});

/* ---------- ふ入りの葉と光合成 ---------- */
function leafFig(){
  let s=P('M20,70 Q80,0 180,40 Q220,70 180,100 Q80,140 20,70 Z',{c:'pap'});
  s+=P('M20,70 Q60,40 100,50 Q70,90 20,70 Z',{c:'gy'});
  s+=R(90,30,60,80,{c:'nf',w:2})+P('M90,30 L150,30 L150,110 L90,110 Z',{c:'nf',w:2,dd:'5 3'});
  s+=T(40,64,'ふ',{s:10})+T(120,24,'アルミニウムはく',{s:10});
  s+=T(60,70,'A',{s:12,w:1})+T(170,70,'B',{s:12,w:1})+T(105,72,'C',{s:12,w:1})+T(130,90,'D',{s:12,w:1});
  return svg(230,130,s);
}
unit({id:'b_leaf',f:'生物',n:'ふ入りの葉と光合成',gen(r){
  const lead=`ふ入りの葉をもつアサガオを一晩暗い所に置いた。次の日、図のように葉の一部をアルミニウムはくでおおい、光を十分に当てた。その後、葉をつみとって熱湯につけたあと、あたためたエタノールにつけ、水洗いしてからヨウ素液につけた。図のAはふ（白い部分）で光が当たった部分、Bは緑色で光が当たった部分、Cはふでアルミニウムはくでおおった部分、Dは緑色でアルミニウムはくでおおった部分である。あとの問いに答えなさい。`;
  const body=figs(fig('図',leafFig()));
  const pool=[];
  const c=mcFixed(['A','B','C','D'],1,4);
  pool.push(Q(`ヨウ素液で青紫色になったのはA〜Dのどこか。${c.h}`,c.a,'光が当たった緑色の部分でデンプンがつくられる。'));
  pool.push(Q(`光合成に光が必要であることは、どの部分とどの部分の結果を比べるとわかるか。`,'BとD','緑色の部分どうしで、光の有無だけがちがう。'));
  pool.push(Q(`光合成が葉の緑色の部分（葉緑体）で行われることは、どの部分とどの部分の結果を比べるとわかるか。`,'AとB','光が当たった部分どうしで、葉緑体の有無だけがちがう。'));
  pool.push(Q(`アサガオを一晩暗い所に置いた理由を書きなさい。`,'葉にあったデンプンをなくしておくため。','暗い所では光合成が行われず、デンプンは糖に変えられて他の部分へ運ばれる。'));
  pool.push(Q(`葉をあたためたエタノールにつける理由を書きなさい。`,'葉を脱色して、ヨウ素液の色の変化を見やすくするため。','エタノールは引火しやすいので、直接火で加熱せず湯であたためる。'));
  return {lead,body,qs:take(r,pool,5)};
}});

  pool.push(Q(`${s[0]}の日の${cities[0][0]}と${cities[1][0]}の南中高度の差は何度か。`,`${cities[1][1]-cities[0][1]}°`,'同じ日なら、南中高度の差は緯度の差に等しい。緯度が低い方が南中高度は高い。'));
  pool.push(Q(`${cities[1][0]}で、北極星の高度は約何度か。`,`約${cities[1][1]}°`,'北極星の高度はその地点の緯度にほぼ等しい。'));
  pool.push(Q(`春分の日に、赤道上の地点での太陽の南中高度は何度か。`,'90°','春分・秋分の南中高度＝90°−緯度。赤道は緯度0°。'));
  const c=mc(r,'北の空',['南の空','東の空','西の空']);

  const c=mc(r,'地球が太陽のまわりを公転しているから',['地球が自転しているから','星座が動いているから','太陽が自転しているから']);
  pool.push(Q(`季節によって見える星座が変わる理由として正しいものを選びなさい。${c.h}`,c.a,'地球の公転によって、真夜中に見える方向（太陽と反対側）が変わる（年周運動）。'));

  pool.push(Q(`校舎から${w} m離れた場所で手をたたくと、反射した音が聞こえるまでに何秒かかるか。音の速さを340 m/sとして求めなさい。`,`${nm(rd(2*w/340,3))}秒`,`往復${2*w} m。${2*w}÷340`));
  const c2=mc(r,'何回かはかって平均を求める',['1回だけはかる','一番短い時間を使う','一番長い時間を使う']);

/* ---------- 茎の断面と水の通り道 ---------- */
function stemFig(ring){
  let s=C(60,60,50,{c:'pap'});
  if(ring){for(let i=0;i<10;i++){const a=i/10*Math.PI*2;s+=`<ellipse cx="${(60+34*Math.cos(a)).toFixed(1)}" cy="${(60+34*Math.sin(a)).toFixed(1)}" rx="5" ry="7" class="gy" stroke-width="1" transform="rotate(${(a*180/Math.PI+90).toFixed(0)} ${(60+34*Math.cos(a)).toFixed(1)} ${(60+34*Math.sin(a)).toFixed(1)})"/>`;}}
  else{const rr=mkRng(7);for(let i=0;i<18;i++){const a=rr.next()*Math.PI*2,d=Math.sqrt(rr.next())*40;s+=C(60+d*Math.cos(a),60+d*Math.sin(a),3.5,{c:'gy'});}}
  return svg(120,120,s);
}

const FIELDS=['物理','化学','生物','地学'];
const $=s=>document.querySelector(s);
const st={field:'物理',sel:{},count:2,seed:0,ans:false,pmode:'end',pbreak:false};
FIELDS.forEach(f=>st.sel[f]=new Set(UNITS.filter(u=>u.f===f).map(u=>u.id)));

function genMini(r,fields){
  const pool=[];UNITS.filter(u=>u.mini&&fields.includes(u.f)).forEach(u=>u.mini.forEach(m=>pool.push({u,m})));
  const byF={};pool.forEach(p=>(byF[p.u.f]=byF[p.u.f]||[]).push(p));
  const picks=[];const fs=r.shuffle(Object.keys(byF));let i=0;const used=new Set();
  while(picks.length<Math.min(8,pool.length)&&i<200){const f=fs[i%fs.length];const c=r.shuffle(byF[f]).find(p=>!used.has(p.u.id)||i>60);if(c){picks.push(c);used.add(c.u.id);}i++;}
  return {title:'小問集合',lead:'次の問いに答えなさい。',body:'',qs:picks.map(p=>({...p.m(r),tag:p.u.n}))};
}
function build(){
  const r=mkRng(st.seed);const out=[];
  if(st.field==='小問集合'){
    for(let k=0;k<st.count;k++)out.push(genMini(mkRng(st.seed+k*7919),FIELDS));
  }else{
    const ids=st.field==='ミックス'?FIELDS.flatMap(f=>[...st.sel[f]]):[...st.sel[st.field]];
    if(!ids.length)return null;
    let bag=r.shuffle(ids);
    for(let k=0;k<st.count;k++){
      if(!bag.length)bag=r.shuffle(ids);
      const uid=bag.pop();const u=UNITS.find(x=>x.id===uid);
      const g=u.gen(mkRng(st.seed+k*7919+1));
      out.push({title:u.n,field:u.f,theme:themeOf(u.id),...g});
    }
  }
  return out;
}
function render(){
  const data=build();const sheet=$('#sheet');
  if(!data){sheet.innerHTML='<p class="empty">単元が1つも選ばれていません。上の一覧から単元を選んでください。</p>';return;}
  let h=`<header class="exam-h"><div class="eh-l"><span class="eh-sub">入試形式演習</span><span class="eh-t">理　科</span></div><div class="eh-r"><span>問題番号 <b class="code">${code(st.seed)}</b></span><span class="nm">氏名<i></i></span></div></header>`;
  let key='';
  data.forEach((d,i)=>{
    h+=`<section class="dai"><div class="dai-h"><span class="dno">${i+1}</span><span class="dtag">${d.field?d.field+'・':''}${d.theme?d.theme+'・':''}${d.title}</span></div><p class="lead">${d.lead}</p>${d.body}<ol class="qs">`;
    d.qs.forEach((q,j)=>{
      h+=`<li><span class="qn">(${j+1})</span><div class="qb"><div class="qt">${q.tag?`<span class="qtag">${q.tag}</span>`:''}${q.q}</div><div class="ans"><span class="al">解答</span><span class="av">${q.a}</span>${q.e?`<div class="ae"><span class="el">解説</span>${q.e}</div>`:''}</div></div></li>`;
    });
    h+='</ol></section>';
    key+=`<div class="key-row"><span class="kno">${i+1}</span><span>${d.qs.map((q,j)=>`(${j+1}) ${/<svg/.test(q.a)?"図は上の解答を参照":q.a}`).join('　')}</span></div>`;
  });
  h+=`<section class="keys"><div class="keys-h">解答一覧</div>${key}</section>`;
  h+=`<section class="anssheet"><header class="exam-h"><div class="eh-l"><span class="eh-sub">入試形式演習</span><span class="eh-t">解答・解説</span></div><div class="eh-r"><span>問題番号 <b class="code">${code(st.seed)}</b></span></div></header>${data.map((d,i)=>`<div class="as-dai"><div class="dai-h"><span class="dno">${i+1}</span><span class="dtag">${d.title}</span></div><ol>${d.qs.map((q,j)=>`<li><span>(${j+1})</span><div><span class="as-a">${q.a}</span>${q.e?`<div class="as-e">${q.e}</div>`:''}</div></li>`).join('')}</ol></div>`).join('')}</section>`;
  sheet.innerHTML=h;
}
function code(n){return n.toString(36).toUpperCase().padStart(5,'0');}

const PM=[['none','解答は印刷しない'],['end','解答・解説を最後のページに'],['inline','解答を各問題の下に']];
function drawPrint(){
  $('#pmode').innerHTML=PM.map(p=>`<button type="button" class="seg${st.pmode===p[0]?' on':''}" data-pm="${p[0]}" aria-pressed="${st.pmode===p[0]}">${p[1]}</button>`).join('');

function setAns(v){st.ans=v;document.body.classList.toggle('show-ans',v);$('#ansBtn').textContent=v?'解答と解説をかくす':'解答と解説を表示';$('#ansBtn').setAttribute('aria-pressed',v);}

document.addEventListener('click',e=>{
  const f=e.target.closest('[data-f].seg');if(f){st.field=f.dataset.f;drawFieldTabs();drawUnits();newSeed();render();save();return;}
  const pm=e.target.closest('[data-pm]');if(pm){st.pmode=pm.dataset.pm;drawPrint();save();return;}
  const n=e.target.closest('[data-n]');if(n){st.count=+n.dataset.n;drawCount();render();save();return;}
  const op=e.target.closest('[data-open]');if(op){const k=op.dataset.open;st.open.has(k)?st.open.delete(k):st.open.add(k);drawUnits();return;}
  const on1=e.target.closest('[data-only]');if(on1){const [f,ti]=on1.dataset.only.split('|');(st.field==='ミックス'?FIELDS:[f]).forEach(ff=>st.sel[ff]=new Set());st.sel[f]=new Set(THEMES[f][+ti][1]);drawUnits();newSeed();render();save();return;}
  if(e.target.id==='openAll'){const fs=st.field==='ミックス'?FIELDS:[st.field];if(st.open.size)st.open.clear();else fs.forEach(f=>THEMES[f].forEach((_,i)=>st.open.add(f+'|'+i)));drawUnits();return;}
  if(e.target.id==='allOn'||e.target.id==='allOff'){const on=e.target.id==='allOn';const fs=st.field==='ミックス'?FIELDS:[st.field];fs.forEach(ff=>{st.sel[ff]=new Set(on?UNITS.filter(u=>u.f===ff).map(u=>u.id):[]);});drawUnits();render();save();return;}
});
document.addEventListener('change',e=>{

  const c=e.target.closest('[data-u]');if(c){const s=st.sel[c.dataset.f];c.checked?s.add(c.dataset.u):s.delete(c.dataset.u);drawUnits();const el=document.getElementById('u_'+c.dataset.u);if(el)el.focus();newSeed();render();save();}
});

$('#pbreak').addEventListener('change',e=>{st.pbreak=e.target.checked;drawPrint();save();});
$('#printBtn').addEventListener('click',()=>{try{window.print();}catch(e){}});
$('#codeForm').addEventListener('submit',e=>{e.preventDefault();const v=parseInt($('#codeIn').value.trim(),36);if(!isNaN(v)){st.seed=v;render();$('#codeMsg').textContent='';}else $('#codeMsg').textContent='英数字の問題番号を入力してください。';});

function save(){try{localStorage.setItem('rika-gen',JSON.stringify({field:st.field,count:st.count,pmode:st.pmode,pbreak:st.pbreak,sel:Object.fromEntries(FIELDS.map(f=>[f,[...st.sel[f]]]))}));}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem('rika-gen')||'null');if(!o)return;if(o.field)st.field=o.field;if(o.count)st.count=o.count;if(o.pmode)st.pmode=o.pmode;if(o.pbreak!=null)st.pbreak=!!o.pbreak;if(o.sel)FIELDS.forEach(f=>{if(o.sel[f])st.sel[f]=new Set(o.sel[f].filter(id=>UNITS.some(u=>u.id===id)));});}catch(e){}}

load();newSeed();drawFieldTabs();drawUnits();drawCount();drawPrint();setAns(false);render();
if(canPrint()){$('#printBtn').hidden=false;$('#printHint').textContent='A4用紙に合わせて印刷されます。PDFで保存するときは、印刷画面の送信先で「PDFに保存」を選んでください。';}
else{$('#printHint').textContent='この画面からは印刷画面を開けません。このページのHTMLファイルをパソコンのブラウザで開くと「印刷する」ボタンが表示され、A4で印刷できます。';}
$('#nUnits').textContent=UNITS.length;

</script>

</body>
</html>
